<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Seyyah2026 - A3 Tek Sayfa</title>
    <style>
        /* Sayfa bölünmesini engellemek için kritik ayarlar */
        @page { size: A3 portrait; margin: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #ccc; }
        
        .page { 
            width: 297mm; 
            height: 420mm; 
            padding: 10mm; /* Kenarlardan biraz daha pay bıraktım */
            margin: auto; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
            page-break-after: always;
            overflow: hidden; /* Taşmayı engeller */
        }
        
        .image-container { 
            width: 100%; 
            height: 175mm; /* Yüksekliği biraz azalttım ki takvim sıkışmasın */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .header-name { 
            font-size: 70pt; /* Puntoyu hafif küçülterek yer açtım */
            font-weight: bold; 
            margin: 10px 0; 
            text-align: center;
            color: #d32f2f; 
            text-transform: uppercase; 
            letter-spacing: 5px;
        }

        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            flex-grow: 1; 
        }
        .month { border: 1px solid #eee; padding: 5px; height: auto; }
        .month-name { 
            font-weight: bold; 
            text-align: center; 
            background: #222; 
            color: white;
            font-size: 13pt; 
            padding: 4px; 
            margin-bottom: 5px; 
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 10pt; }
        th { color: #888; padding: 2px; font-size: 8pt; }
        td { text-align: center; padding: 4px; }
        .weekend { color: #d32f2f; font-weight: bold; }

        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; }
            .month-name { -webkit-print-color-adjust: exact; }
            .weekend { -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="image-container">
        <img src="5.jpg" alt="cami 2026">
    </div>

    <div class="header-name">2026 TAKVİMİ</div>
<div class="sub-text" style="font-size:16pt; font-style:italic; text-align:center; color:#555; margin-bottom:15px; padding:0 40px;">
    "Zamanı durduramazsınız ama her anını bir anıya dönüştürebilirsiniz. <br>2026, takvimdeki rakamlardan ibaret değil; sizin yazacağınız en güzel hikayelerin yılı olsun."
</div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<script>
    const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    const days = ["Pz", "Pt", "Sa", "Ça", "Pe", "Cu", "Ct"];
    const calendarDiv = document.getElementById('calendar');

    for (let m = 0; m < 12; m++) {
        let date = new Date(2026, m, 1);
        let monthDiv = document.createElement('div');
        monthDiv.className = 'month';
        
        let table = `<table><div class="month-name">${months[m]}</div><tr>`;
        days.forEach(d => table += `<th>${d}</th>`);
        table += '</tr><tr>';

        for (let i = 0; i < date.getDay(); i++) table += '<td></td>';

        while (date.getMonth() === m) {
            if (date.getDay() === 0 && date.getDate() !== 1) table += '</tr><tr>';
            let cls = (date.getDay() === 0 || date.getDay() === 6) ? 'class="weekend"' : '';
            table += `<td ${cls}>${date.getDate()}</td>`;
            date.setDate(date.getDate() + 1);
        }
        table += '</tr></table>';
        monthDiv.innerHTML = table;
        calendarDiv.appendChild(monthDiv);
    }
</script>

</body>
</html>
