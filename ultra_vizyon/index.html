<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkaplan Tasarımı</title>
    <style>
        /* Kenar boşluklarını sıfırlıyoruz */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Kaydırma çubuğunu gizler */
            background-color: #000000;
        }

        .fullscreen-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('img/ultra_vizyon.jpg');
            background-size: cover; /* Resmi tüm ekrana yayar, boşluk bırakmaz */
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        </div>

</body>

</html>
