while (siirler.length < hedefSayi) {
    siirler.push({ 
        baslik: "YAKINDA", 
        yazar: "Yeni Şiir", 
        resim: "images/yakinda.jpeg",

        tamMetin: "Bu bölüm yeni şiirleriniz için ayrılmıştır." 
    });
}

const liste = document.getElementById('siir-listesi');
siirler.forEach(siir => {
    const kart = document.createElement('div');
    kart.className = 'siir-kart';
    kart.onclick = () => showSiir(siir);
    kart.innerHTML = `
        <img src="${siir.resim}" onerror="this.src='https://via.placeholder.com/300x200?text=Siir+Resmi'">
        <h3>${siir.baslik}</h3>
        <p class="on-izleme">${siir.ozet}</p>
        <span class="shair-name">${siir.yazar}</span>
    `;
    liste.appendChild(kart);
});

function showSiir(siir) {
    document.getElementById("modal-resim").src = siir.resim;
    document.getElementById("modal-baslik").innerText = siir.baslik;
    document.getElementById("modal-yazar").innerText = "Yazar: " + siir.yazar;
    document.getElementById("modal-siir-metin").innerHTML = siir.tamMetin;
    document.getElementById("siirModal").style.display = "block";
}

function closeModal() {
    document.getElementById("siirModal").style.display = "none";
}

window.onclick = function(event) {
    if (event.target == document.getElementById("siirModal")) {
        closeModal();
    }
}
