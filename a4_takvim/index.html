<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2026 A4 Takvimi - Seyyah2026</title>
    <style>
        /* A4 portrait boyutu ayarları */
        @page { size: A4 portrait; margin: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
        
        .page { 
            width: 210mm; 
            height: 297mm; 
            padding: 8mm; 
            margin: auto; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Resim Alanı - A4 için optimize edildi */
        .image-container { 
            width: 100%; 
            height: 100mm; /* A4'te dengeli bir oran */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            border-radius: 4px;
        }
        .image-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* İsim Bölümü */
        .header-name { 
            font-size: 50pt; 
            font-weight: bold; 
            margin: 8px 0; 
            text-align: center;
            color: #d32f2f; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        /* Takvim Izgarası */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            flex-grow: 1; 
        }
        .month { border: 1px solid #eee; padding: 4px; }
        .month-name { 
            font-weight: bold; 
            text-align: center; 
            background: #222; 
            color: white;
            font-size: 9pt; 
            padding: 2px; 
            margin-bottom: 4px; 
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 7.5pt; }
        th { color: #888; padding: 1px; font-size: 6.5pt; }
        td { text-align: center; padding: 2px; }
        .weekend { color: #d32f2f; font-weight: bold; }

        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; }
            .month-name { -webkit-print-color-adjust: exact; }
            .weekend { -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="image-container">
        <img src="4.jpg" alt="cami 2026">
    </div>

    <div class="header-name">2026 TAKVİMİ </div>
<div class="sub-text" style="font-size:11pt; font-style:italic; text-align:center; color:#555; margin-bottom:10px; padding:0 20px;">
    "Zamanı durduramazsınız ama her anını bir anıya dönüştürebilirsiniz. <br>2026, takvimdeki rakamlardan ibaret değil; sizin yazacağınız en güzel hikayelerin yılı olsun."
</div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<script>
    const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    const days = ["Pz", "Pt", "Sa", "Ça", "Pe", "Cu", "Ct"];
    const calendarDiv = document.getElementById('calendar');

    for (let m = 0; m < 12; m++) {
        let date = new Date(2026, m, 1);
        let monthDiv = document.createElement('div');
        monthDiv.className = 'month';
        
        let table = `<table><div class="month-name">${months[m]}</div><tr>`;
        days.forEach(d => table += `<th>${d}</th>`);
        table += '</tr><tr>';

        for (let i = 0; i < date.getDay(); i++) table += '<td></td>';

        while (date.getMonth() === m) {
            if (date.getDay() === 0 && date.getDate() !== 1) table += '</tr><tr>';
            let cls = (date.getDay() === 0 || date.getDay() === 6) ? 'class="weekend"' : '';
            table += `<td ${cls}>${date.getDate()}</td>`;
            date.setDate(date.getDate() + 1);
        }
        table += '</tr></table>';
        monthDiv.innerHTML = table;
        calendarDiv.appendChild(monthDiv);
    }
</script>

</body>
</html>
