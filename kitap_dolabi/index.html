<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF8">
<style>
    div#container { position:relative; width: 1000px; margin: 0 auto; text-align:left; }
    body { text-align:center; margin:0; background-color: #FFCC99; }
    
    /* AHŞABA GÖMÜLÜ OYMA YAZI */
    .gomulu-yazi {
        font-family: "Georgia", serif;
        font-weight: bold;
        color: #3d2416;
        text-shadow: -1px -1px 1px #1a100a, 1px 1px 1px #8b5a2b;
        pointer-events: none;
    }

    #ust-baslik { position: absolute; left: 0; top: 75px; width: 1000px; text-align: center; font-size: 36px; z-index: 100; }
    #alt-imza { position: absolute; left: 0; top: 705px; width: 1000px; text-align: center; font-size: 20px; font-style: italic; z-index: 100; }

    /* TANITIM BUTONU */
    .tanitim-btn {
        position: absolute; left: 420px; top: 740px;
        padding: 10px 20px; background: #3d2416; color: #fff;
        border: none; border-radius: 5px; cursor: pointer; font-family: sans-serif;
    }
    .tanitim-btn:hover { background: #5a3621; }

    /* MODAL (BİLGİ PENCERESİ) */
    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
    .modal-content { background-color: #fff; margin: 10% auto; padding: 30px; border-radius: 15px; width: 450px; text-align: center; line-height: 1.6; border: 5px solid #3d2416; }
    .close { color: #cc0000; float: right; font-size: 30px; font-weight: bold; cursor: pointer; }
    .book-clickable { cursor: pointer; transition: transform 0.2s; }
    .book-clickable:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="bookTitle" style="color:#3d2416;"></h2>
    <hr>
    <div id="bookDescription" style="text-align:justify; color:#333;"></div>
  </div>
</div>

<div id="container">
    <div id="ust-baslik" class="gomulu-yazi">Dost Yurdu Kitaplığı</div>
    <div id="alt-imza" class="gomulu-yazi">Seyyah</div>

    <div style="position:absolute; left:0px; top:56px; width:1000px; height:700px; z-index:0">
        <img src="images/dolap.png" width=1000 height=700>
    </div>

    <div class="book-clickable" onclick="showBook('Huzur Sokağı', 'Satış rekorları kırmış, her yaştan insanın okuduğu bir başyapıt... <p></p> Özlenilen huzur dolu cemiyetin bir sokakta sembolleşmiş halidir.')" style="position:absolute; left:868px; top:203px; width:88px; height:137px; z-index:20">
        <img src="images/huzur_sokagi.png" width=88 height=137>
    </div>

    <button class="tanitim-btn" onclick="rastgeleTanit()">Bir Kitap Tanıt</button>
</div>

<script>
// Kitap verilerini bir diziye alıyoruz (Başkaları kolayca eklesin diye)
const kitaplar = [
    {ad: 'Huzur Sokağı', ozet: 'Hasretiyle kavrulduğumuz huzurlu bir cemiyetin sembolüdür. <p></p> Her kesimden insanın ilgiyle okuduğu bir eserdir.'},
    {ad: 'Seyyah', ozet: 'Şehirlerin ruhuna yapılan içten bir yolculuk. <p></p> Kudüs\'ten İstanbul\'a uzanan manevi bir bağın hikayesi.'}
    // Buraya diğer kitaplar eklenebilir
];

function showBook(title, desc) {
    document.getElementById("bookTitle").innerHTML = title;
    document.getElementById("bookDescription").innerHTML = desc;
    document.getElementById("myModal").style.display = "block";
}

function closeModal() { document.getElementById("myModal").style.display = "none"; }

function rastgeleTanit() {
    const r = Math.floor(Math.random() * kitaplar.length);
    showBook(kitaplar[r].ad, kitaplar[r].ozet);
}

window.onclick = function(event) { if (event.target == document.getElementById("myModal")) closeModal(); }
</script>
</body>
</html>
