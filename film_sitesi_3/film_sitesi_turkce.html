<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix - Film Gezgini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 2.5em;
            font-weight: bold;
            color: #e50914;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 8px 15px;
            border: 1px solid #333;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #e50914;
        }

        .clear-btn {
            padding: 8px 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
            display: none;
        }

        .clear-btn:hover {
            background: #b8070f;
        }

        .clear-btn.show {
            display: inline-block;
        }

        .main-content {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 600;
        }

        .carousel-container {
            position: relative;
            margin-bottom: 50px;
        }

        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 15px;
            padding: 20px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        .trending-card {
            position: relative;
            min-width: 300px;
            height: 450px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, rgba(229, 9, 20, 0.1), rgba(0, 0, 0, 0.8));
        }

        .trending-card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(229, 9, 20, 0.3);
        }

        .trending-card .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .trending-card:hover .movie-poster {
            transform: scale(1.1);
        }

        .trending-rank {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(229, 9, 20, 0.9);
            color: white;
            font-size: 1.8em;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 10px;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .trending-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
            padding: 40px 20px 20px;
            color: white;
        }

        .trending-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .trending-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .movie-rating {
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85em;
        }

        /* Dinamik Puan Renkleri */
        .rating-high { background: #2ecc71; }
        .rating-mid { background: #f1c40f; color: black; }
        .rating-low { background: #e74c3c; }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .carousel-btn:hover {
            background: #e50914;
        }

        .carousel-btn.prev { left: -25px; }
        .carousel-btn.next { right: -25px; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
		/* Bu kısım mevcut .movie-card kodunla uyumlu çalışır */
.movie-card .movie-poster {
    width: 100%;
    height: auto;           /* Sabit yüksekliği devre dışı bırakır */
    aspect-ratio: 2 / 3;    /* Alt taraftaki afişleri ideal orana getirir */
    object-fit: cover;
}

/* Üstteki kayan afişlerin (Trendler) boyunu korur */
.trending-card .movie-poster {
    width: 100%;
    height: 100%;           /* Senin beğendiğin o uzun yapı aynen kalır */
    object-fit: cover;
}
        .movie-card:hover {
            transform: translateY(-10px);
            border-color: #e50914;
            background: rgba(255, 255, 255, 0.08);
        }

        .movie-info { padding: 15px; }
        
        .movie-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #e50914;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .carousel-btn { display: none; }
            .movies-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">MovieFlix</div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Film ara..." id="searchInput">
            </div>
            <div class="filters">
                <select id="genreFilter">
                    <option value="">Tüm Türler</option>
                </select>
                <select id="yearFilter">
                    <option value="">Tüm Yıllar</option>
                </select>
                <select id="sortFilter">
                    <option value="">Sıralama Yok</option>
                    <option value="popularity.desc">En Popüler</option>
                    <option value="vote_average.desc">En Yüksek Puan</option>
                    <option value="release_date.desc">En Yeni</option>
                    <option value="title.asc">A-Z</option>
                </select>
            </div>
            <button class="clear-btn" id="clearBtn">Temizle</button>
        </div>
    </div>

    <div class="main-content">
        <div id="trendingSection">
            <div class="section-title">🔥 Trend Filmler</div>
            <div class="carousel-container">
                <button class="carousel-btn prev" id="trendingPrev">‹</button>
                <div class="carousel" id="trendingCarousel">
                    <div class="loading">Trend filmler yükleniyor...</div>
                </div>
                <button class="carousel-btn next" id="trendingNext">›</button>
            </div>
        </div>

        <div class="section-title" id="randomSectionTitle">🎬 Keşfet</div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">Filmler yükleniyor...</div>
        </div>
    </div>

    <div class="back-to-top" id="backToTop">↑</div>

    <script>
        class MovieExplorer {
            constructor() {
                this.API_KEY = '89b82830eb424a86b7c63ce9c1b8b5a8';
                this.BASE_URL = 'https://api.themoviedb.org/3';
                this.IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
                this.FALLBACK_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjgwIiBoZWlnaHQ9IjMwMCIgdmlld0JveD0iMCAwIDI4MCAzMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyODAiIGhlaWdodD0iMzAwIiBmaWxsPSIjMzMzIi8+Cjx0ZXh0IHg9IjE0MCIgeT0iMTUwIiBmaWxsPSIjNjY2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+UmVzaW0gWW9rPC90ZXh0PC9zdmc+';
                this.genres = {};
                this.currentFilters = { genre: '', year: '', sort: '' };
                
                this.init();
            }

            async init() {
                this.setupEventListeners();
                await this.loadGenres();
                this.setupYearFilter();
                await this.loadTrendingMovies();
                await this.loadRandomMovies();
                this.setupBackToTop();
            }

            setupEventListeners() {
                const searchInput = document.getElementById('searchInput');
                const genreFilter = document.getElementById('genreFilter');
                const yearFilter = document.getElementById('yearFilter');
                const sortFilter = document.getElementById('sortFilter');
                const clearBtn = document.getElementById('clearBtn');
                
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => this.handleSearch(e.target.value), 500);
                });

                genreFilter.addEventListener('change', () => this.handleFilterChange());
                yearFilter.addEventListener('change', () => this.handleFilterChange());
                sortFilter.addEventListener('change', () => this.handleFilterChange());
                clearBtn.addEventListener('click', () => this.clearAllFilters());

                document.getElementById('trendingPrev').onclick = () => this.scrollCarousel('prev');
                document.getElementById('trendingNext').onclick = () => this.scrollCarousel('next');
            }

            setupBackToTop() {
                const btn = document.getElementById('backToTop');
                window.onscroll = () => {
                    btn.style.display = window.scrollY > 300 ? "flex" : "none";
                };
                btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            async loadGenres() {
                try {
                    const response = await fetch(`${this.BASE_URL}/genre/movie/list?api_key=${this.API_KEY}&language=tr-TR`);
                    const data = await response.json();
                    this.genres = data.genres.reduce((acc, g) => ({ ...acc, [g.id]: g.name }), {});
                    const genreSelect = document.getElementById('genreFilter');
                    data.genres.forEach(g => {
                        const opt = new Option(g.name, g.id);
                        genreSelect.add(opt);
                    });
                } catch (e) { console.error('Türler yüklenemedi'); }
            }

            getRatingClass(rating) {
                if (rating >= 7.5) return 'rating-high';
                if (rating >= 5.0) return 'rating-mid';
                return 'rating-low';
            }

            setupYearFilter() {
                const yearSelect = document.getElementById('yearFilter');
                for (let y = new Date().getFullYear(); y >= 1970; y--) {
                    yearSelect.add(new Option(y, y));
                }
            }

            async loadTrendingMovies() {
                try {
                    const response = await fetch(`${this.BASE_URL}/trending/movie/week?api_key=${this.API_KEY}&language=tr-TR`);
                    const data = await response.json();
                    this.displayTrendingMovies(data.results.slice(0, 10));
                } catch (e) { 
                    document.getElementById('trendingCarousel').innerHTML = '<div class="error">Veri alınamadı.</div>';
                }
            }

            async loadRandomMovies() {
                try {
                    const page = Math.floor(Math.random() * 5) + 1;
                    const response = await fetch(`${this.BASE_URL}/discover/movie?api_key=${this.API_KEY}&language=tr-TR&page=${page}`);
                    const data = await response.json();
                    this.displayMovies(data.results, 'moviesGrid');
                } catch (e) { console.error('Hata'); }
            }

            displayTrendingMovies(movies) {
                const carousel = document.getElementById('trendingCarousel');
                carousel.innerHTML = movies.map((m, i) => this.createTrendingCard(m, i + 1)).join('');
            }

            createTrendingCard(m, rank) {
                const rating = m.vote_average || 0;
                return `
                    <div class="trending-card">
                        <img src="${m.poster_path ? this.IMAGE_BASE_URL+m.poster_path : this.FALLBACK_IMAGE}" class="movie-poster">
                        <div class="trending-rank">#${rank}</div>
                        <div class="trending-overlay">
                            <div class="trending-title">${m.title}</div>
                            <div class="trending-details">
                                <span>${m.release_date ? m.release_date.split('-')[0] : 'Bilinmiyor'}</span>
                                <span class="movie-rating ${this.getRatingClass(rating)}">★ ${rating.toFixed(1)}</span>
                            </div>
                        </div>
                    </div>`;
            }

            displayMovies(movies, containerId) {
                const container = document.getElementById(containerId);
                if (!movies.length) {
                    container.innerHTML = '<div class="no-results"><h2>Sonuç bulunamadı.</h2></div>';
                    return;
                }
                container.innerHTML = movies.map(m => this.createMovieCard(m)).join('');
            }

            createMovieCard(m) {
                const rating = m.vote_average || 0;
                const genres = m.genre_ids ? m.genre_ids.slice(0, 2).map(id => this.genres[id]).join(', ') : 'Genel';
                return `
                    <div class="movie-card">
                        <img src="${m.poster_path ? this.IMAGE_BASE_URL+m.poster_path : this.FALLBACK_IMAGE}" class="movie-poster">
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-details">
                                <span>${m.release_date ? m.release_date.split('-')[0] : '-'}</span>
                                <span class="movie-rating ${this.getRatingClass(rating)}">★ ${rating.toFixed(1)}</span>
                            </div>
                            <div style="font-size: 0.8em; color: #aaa; margin-bottom: 5px;">${genres}</div>
                            <div class="movie-description" style="font-size: 0.85em; color: #888; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${m.overview || 'Açıklama mevcut değil.'}</div>
                        </div>
                    </div>`;
            }

            async handleSearch(query) {
                if (!query.trim()) {
                    this.clearAllFilters();
                    return;
                }
                document.getElementById('trendingSection').style.display = 'none';
                document.getElementById('randomSectionTitle').textContent = `"${query}" için sonuçlar`;
                document.getElementById('clearBtn').classList.add('show');
                
                const response = await fetch(`${this.BASE_URL}/search/movie?api_key=${this.API_KEY}&query=${encodeURIComponent(query)}&language=tr-TR`);
                const data = await response.json();
                this.displayMovies(data.results, 'moviesGrid');
            }

            async handleFilterChange() {
                this.currentFilters = {
                    genre: document.getElementById('genreFilter').value,
                    year: document.getElementById('yearFilter').value,
                    sort: document.getElementById('sortFilter').value
                };
                document.getElementById('clearBtn').classList.add('show');
                document.getElementById('trendingSection').style.display = 'none';
                document.getElementById('randomSectionTitle').textContent = 'Filtrelenmiş Filmler';

                let url = `${this.BASE_URL}/discover/movie?api_key=${this.API_KEY}&language=tr-TR`;
                if(this.currentFilters.genre) url += `&with_genres=${this.currentFilters.genre}`;
                if(this.currentFilters.year) url += `&primary_release_year=${this.currentFilters.year}`;
                if(this.currentFilters.sort) url += `&sort_by=${this.currentFilters.sort}`;

                const response = await fetch(url);
                const data = await response.json();
                this.displayMovies(data.results, 'moviesGrid');
            }

            clearAllFilters() {
                document.getElementById('searchInput').value = '';
                document.getElementById('genreFilter').value = '';
                document.getElementById('yearFilter').value = '';
                document.getElementById('sortFilter').value = '';
                document.getElementById('clearBtn').classList.remove('show');
                document.getElementById('trendingSection').style.display = 'block';
                document.getElementById('randomSectionTitle').textContent = '🎬 Keşfet';
                this.loadRandomMovies();
            }

            scrollCarousel(dir) {
                const c = document.getElementById('trendingCarousel');
                c.scrollBy({ left: dir === 'prev' ? -350 : 350, behavior: 'smooth' });
            }
        }

        document.addEventListener('DOMContentLoaded', () => new MovieExplorer());
    </script>
</body>
</html>
