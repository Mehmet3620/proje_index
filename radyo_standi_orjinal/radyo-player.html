<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Derli Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    .main-container {
      width: 1000px;
      height: 700px;
      margin: 20px auto;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
    }
    .track { transition: all 0.15s; }
    .track:hover { background: #1e293b; }
    .playing { background: #6366f1 !important; color: white; }
    .album-art { background: linear-gradient(135deg, #6366f1, #a855f7); }

    /* İnce ve uyumlu playlist scrollbar */
    #playlist::-webkit-scrollbar {
      width: 4px;
    }
    #playlist::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 10px;
    }
    #playlist::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 10px;
    }
    #playlist::-webkit-scrollbar-thumb:hover {
      background: #6366f1;
    }

    /* Radyo listesi scrollbar (aynı stil) */
    #radioList::-webkit-scrollbar {
      width: 4px;
    }
    #radioList::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 10px;
    }
    #radioList::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 10px;
    }
    #radioList::-webkit-scrollbar-thumb:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Header / Player üst kısım -->
    <div class="bg-gradient-to-b from-gray-900 to-gray-950 p-5 border-b border-gray-800 relative">
      <!-- Saat & Tarih -->
      <div id="datetime" class="absolute top-3 right-4 text-xs font-mono text-gray-400 bg-gray-800/60 px-3 py-1 rounded-md"></div>

      <div class="flex flex-col items-center gap-4">
        <div class="album-art w-28 h-28 rounded-xl shadow-2xl flex items-center justify-center text-5xl">
          🎧
        </div>

        <div class="text-center">
          <h2 id="nowTitle" class="text-lg font-semibold line-clamp-1">Henüz bir şey yok</h2>
          <p id="nowSubtitle" class="text-gray-400 text-xs">Radyo veya müzik bekliyor</p>
        </div>

        <div class="flex items-center gap-6">
          <button onclick="prevTrack()" class="text-2xl text-gray-400 hover:text-indigo-400"><i class="fa-solid fa-backward-step"></i></button>
          
          <button id="playBtn" onclick="togglePlay()" class="w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center text-3xl shadow-md hover:bg-indigo-500 transition">
            <i class="fa-solid fa-play"></i>
          </button>
          
          <button onclick="nextTrack()" class="text-2xl text-gray-400 hover:text-indigo-400"><i class="fa-solid fa-forward-step"></i></button>

          <button id="shuffleBtn" onclick="toggleShuffle()" class="text-2xl text-gray-400 hover:text-indigo-400" title="Karıştır">
            <i class="fa-solid fa-shuffle"></i>
          </button>
        </div>

        <div class="w-full max-w-md flex flex-col gap-2 mt-2">
          <input type="range" id="progress" min="0" max="100" value="0" class="w-full accent-indigo-500 h-1.5 bg-gray-700 rounded-full cursor-pointer" oninput="seek(this.value)"/>
          <div class="flex justify-between text-sm text-gray-400 px-1">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
          <div class="flex items-center justify-center gap-4">
            <i class="fa-solid fa-volume-low text-gray-400"></i>
            <input type="range" id="volume" min="0" max="100" value="85" class="w-32 accent-indigo-500 h-1.5 bg-gray-700 rounded-full" oninput="changeVolume(this.value)"/>
          </div>
        </div>
      </div>
    </div>

    <!-- İçerik: Radyolar + Playlist -->
    <div class="flex flex-1 overflow-hidden">

      <!-- Radyolar sidebar -->
      <div class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col">
        <div class="p-4 border-b border-gray-800 text-base font-medium flex items-center gap-3">
          <i class="fa-solid fa-radio text-indigo-400"></i> Radyolar
        </div>
        <div id="radioList" class="flex-1 overflow-auto p-3 space-y-2 text-sm"></div>
        
        <div class="p-3 border-t border-gray-800 space-y-3 bg-gray-950">
          <input id="radioName" placeholder="Radyo ismi" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"/>
          <input id="radioUrl" placeholder="Stream URL" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"/>
          <button onclick="addAndSaveRadio()" class="w-full bg-indigo-700 hover:bg-indigo-600 py-2 rounded text-sm font-medium">Ekle & Kaydet</button>
        </div>
      </div>

      <!-- Playlist bölümü -->
      <div class="flex-1 flex flex-col">
        <div class="p-4 border-b border-gray-800 bg-gray-900 flex justify-between items-center text-base">
          <span class="font-medium">Çalma Listesi</span>
          <div class="flex gap-3">
            <label class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded cursor-pointer text-sm flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Müzik Ekle
              <input type="file" id="localFiles" multiple accept="audio/*" class="hidden" onchange="addLocalFiles()"/>
            </label>
            <button onclick="clearPlaylist()" class="text-red-400 hover:text-red-300 px-4 py-2 rounded text-sm">Temizle</button>
          </div>
        </div>

        <div id="playlist" class="flex-1 overflow-y-auto p-3 space-y-1.5 bg-gray-800/30"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="py-2.5 px-5 bg-gray-900 border-t border-gray-800 text-xs text-gray-500 flex items-center justify-between">
      <div class="font-mono text-gray-400">
        <span id="datetime-footer"></span>
      </div>
      <div>
        Derli Player • © 2025 Mehmet • Denizli, Türkiye
      </div>
      <div class="text-indigo-400 font-medium">
        Tam Sürüm v1.0
      </div>
    </footer>

  </div>

<audio id="audio" class="hidden"></audio>

<script>
// Saat güncelleme (hem header hem footer için)
function updateDateTime() {
  const now = new Date();
  const tr = now.toLocaleString('tr-TR', {
    weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  document.getElementById('datetime').textContent = tr;
  document.getElementById('datetime-footer').textContent = tr;
}
setInterval(updateDateTime, 1000);
updateDateTime();

let tracks = [];
let currentIndex = -1;
let savedRadios = JSON.parse(localStorage.getItem('savedRadios')) || [];
let isShuffle = false;

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffleBtn').style.color = isShuffle ? '#6366f1' : '#9ca3af';
}

function getNextIndex(current) {
  if (!isShuffle || tracks.length <= 1) return (current + 1) % tracks.length;
  let next = Math.floor(Math.random() * tracks.length);
  while (next === current) next = Math.floor(Math.random() * tracks.length);
  return next;
}

function renderRadios() {
  const c = document.getElementById('radioList');
  c.innerHTML = '';
  savedRadios.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'flex items-center justify-between bg-gray-800 hover:bg-gray-700 rounded px-3 py-2 cursor-pointer';
    d.innerHTML = `
      <div class="flex-1 truncate pr-3">
        <div class="font-medium">${r.name}</div>
        <div class="text-xs text-gray-500 truncate">${r.url}</div>
      </div>
      <div class="flex gap-2">
        <button onclick="playRadio(${i});event.stopPropagation()" class="text-green-400 hover:text-green-300"><i class="fa-solid fa-play"></i></button>
        <button onclick="deleteRadio(${i});event.stopPropagation()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
    d.onclick = () => playRadio(i);
    c.appendChild(d);
  });
}

function renderPlaylist() {
  const c = document.getElementById('playlist');
  c.innerHTML = '';
  tracks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = `track flex justify-between items-center px-4 py-2.5 rounded cursor-pointer ${i === currentIndex ? 'playing' : 'bg-gray-800/40 hover:bg-gray-700'}`;
    d.innerHTML = `
      <div class="flex items-center gap-3 flex-1 truncate">
        <span class="text-xl">${t.type === 'stream' ? '📻' : '🎵'}</span>
        <span class="truncate">${t.name}</span>
      </div>
      <button onclick="removeTrack(${i});event.stopPropagation()" class="text-gray-500 hover:text-red-400">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    `;
    d.onclick = () => playTrack(i);
    c.appendChild(d);
  });
}

function addAndSaveRadio() {
  const name = document.getElementById('radioName').value.trim() || 'Radyo';
  const url = document.getElementById('radioUrl').value.trim();
  if (!url) return alert('URL gir lütfen');
  savedRadios.push({name, url});
  localStorage.setItem('savedRadios', JSON.stringify(savedRadios));
  renderRadios();
  addToPlaylist(name, url, 'stream');
  document.getElementById('radioName').value = '';
  document.getElementById('radioUrl').value = '';
}

function deleteRadio(i) {
  if (!confirm('Silinsin mi?')) return;
  savedRadios.splice(i, 1);
  localStorage.setItem('savedRadios', JSON.stringify(savedRadios));
  renderRadios();
}

function playRadio(i) {
  const r = savedRadios[i];
  addToPlaylist(r.name, r.url, 'stream');
  playTrack(tracks.length - 1);
}

function addToPlaylist(name, src, type) {
  tracks.push({name, src, type});
  renderPlaylist();
}

function playTrack(i) {
  if (i < 0 || i >= tracks.length) return;
  currentIndex = i;
  const t = tracks[i];
  document.getElementById('nowTitle').textContent = t.name;
  document.getElementById('nowSubtitle').textContent = t.type === 'stream' ? 'Canlı Radyo' : 'Yerel Dosya';
  audio.src = t.src;
  audio.play().catch(() => {});
  document.getElementById('playBtn').querySelector('i').className = 'fa-solid fa-pause';
  renderPlaylist();
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    document.getElementById('playBtn').querySelector('i').className = 'fa-solid fa-pause';
  } else {
    audio.pause();
    document.getElementById('playBtn').querySelector('i').className = 'fa-solid fa-play';
  }
}

function prevTrack() {
  if (tracks.length === 0) return;
  let prev = currentIndex - 1;
  if (prev < 0) prev = tracks.length - 1;
  playTrack(prev);
}

function nextTrack() {
  if (tracks.length === 0) return;
  let next = getNextIndex(currentIndex);
  playTrack(next);
}

function removeTrack(i) {
  if (i === currentIndex) { 
    audio.pause(); 
    currentIndex = -1; 
    document.getElementById('playBtn').querySelector('i').className = 'fa-solid fa-play'; 
  }
  tracks.splice(i, 1);
  if (currentIndex > i) currentIndex--;
  else if (currentIndex === i && tracks.length > 0) playTrack(0);
  renderPlaylist();
}

function clearPlaylist() {
  if (confirm('Tüm liste silinsin mi?')) {
    tracks = []; currentIndex = -1; audio.pause();
    renderPlaylist();
    document.getElementById('nowTitle').textContent = 'Henüz bir şey yok';
    document.getElementById('playBtn').querySelector('i').className = 'fa-solid fa-play';
  }
}

function addLocalFiles() {
  const files = document.getElementById('localFiles').files;
  for (let f of files) addToPlaylist(f.name, URL.createObjectURL(f), 'local');
  if (currentIndex === -1 && tracks.length) playTrack(0);
}

function changeVolume(v) { audio.volume = v / 100; }

function seek(v) {
  if (audio.duration) audio.currentTime = (v / 100) * audio.duration;
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
  document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
  document.getElementById('totalTime').textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', nextTrack);

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + sec.toString().padStart(2, '0');
}

// Başlangıç
renderRadios();
</script>
</body>
</html>
